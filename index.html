<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortar Strike</title>
  <style>
    :root {
      --bg1: #061019;
      --bg2: #122739;
      --panel: rgba(8, 18, 29, 0.78);
      --panel-border: rgba(255,255,255,0.12);
      --accent: #ff7a30;
      --accent-2: #ffbf69;
      --good: #6ae38d;
      --warn: #ffcb6b;
      --danger: #ff5d63;
      --text: #ecf4ff;
      --muted: #b6c6d9;
      --shadow: rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(circle at top, #1a2f47 0%, var(--bg1) 42%, #040c14 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex; align-items: stretch; justify-content: center;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #6fa6d5 0%, #b9d7eb 18%, #dfe5cf 56%, #7a7f5a 100%);
    }

    canvas {
      width: 100%; height: 100%; display: block;
      background: linear-gradient(to bottom, #7db7e4 0%, #cfebf7 20%, #cfe5aa 62%, #6d7d4a 100%);
    }

    .hud {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    .topbar {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 28px var(--shadow);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .status {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      min-width: 220px;
    }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #ffaf62);
      color: #1e1007; font-weight: 900; font-size: 1.1rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px rgba(255,122,48,.35);
    }

    .status-title {
      font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
      display: block; margin-bottom: 2px;
    }

    .status-value {
      font-size: 1.25rem; font-weight: 800; line-height: 1.1;
    }

    .aim-panel {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px;
      min-width: 340px;
    }

    .aim-label {
      font-size: .68rem; color: var(--muted); letter-spacing: .18em; text-transform: uppercase;
    }

    .aim-main {
      font-size: 1.12rem; font-weight: 800;
      color: var(--text);
      letter-spacing: .04em;
    }

    .bottom {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: min(980px, calc(100vw - 20px));
      display: flex; align-items: end; justify-content: center;
      gap: 12px;
      pointer-events: none;
    }

    .controls {
      display: flex; align-items: center; gap: 10px;
      background: rgba(5,15,22,.7);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,.35);
      pointer-events: auto;
    }

    .group {
      display: flex; flex-direction: column; gap: 5px;
      min-width: 150px;
    }

    .group label {
      font-size: .68rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    }

    .group strong {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
    }

    button {
      border: 0; background: linear-gradient(180deg, #ff8a4c, #d9511b);
      color: #170d09; border-radius: 14px; font-weight: 900; letter-spacing: .05em;
      padding: 12px 18px; box-shadow: 0 10px 20px rgba(217,81,27,.28);
      cursor: pointer; transition: transform .12s ease, filter .12s ease;
    }

    button:hover { filter: brightness(1.06); }
    button:active { transform: translateY(1px); }

    .stepper {
      width: 40px; height: 40px; border-radius: 10px; padding: 0; font-size: 1.6rem;
      background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,.18);
      box-shadow: none;
    }

    input[type="range"] {
      width: 100%; accent-color: var(--accent);
    }

    .info-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 12px rgba(106,227,141,.8);
      display: inline-block;
    }

    .flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0; background: rgba(255,255,255,.25);
      transition: opacity .12s ease;
    }

    .flash.on { opacity: 1; }

    @media (max-width: 760px) {
      .topbar { flex-direction: column; align-items: stretch; }
      .aim-panel { min-width: 0; flex: 1; }
      .bottom { bottom: 12px; }
      .controls { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="scene"></canvas>

    <div class="hud">
      <div class="topbar">
        <div class="panel status">
          <div class="badge">M</div>
          <div>
            <span class="status-title">สถานะ</span>
            <div class="status-value"><span class="info-dot"></span> Ready</div>
          </div>
        </div>

        <div class="panel aim-panel">
          <div>
            <div class="aim-label">เล็ง</div>
            <div class="aim-main" id="aimText">θ 58.0° · ระยะ 1.4 km</div>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div class="controls">
          <button class="stepper" id="angleDown" aria-label="ลดมุม">−</button>
          <div class="group" style="min-width: 170px;">
            <label>มุม</label>
            <strong id="angleValue">58.0°</strong>
            <input id="angle" type="range" min="20" max="82" value="58" step="0.5">
          </div>
          <button class="stepper" id="angleUp" aria-label="เพิ่มมุม">+</button>

          <div class="group" style="min-width: 170px;">
            <label>ระยะ</label>
            <strong id="rangeValue">1.4 km</strong>
            <input id="distance" type="range" min="500" max="4200" value="1400" step="10">
          </div>

          <button id="fireBtn">ยิง</button>
        </div>
      </div>
    </div>

    <div class="flash" id="flash"></div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const angleInput = document.getElementById('angle');
    const distanceInput = document.getElementById('distance');
    const angleValue = document.getElementById('angleValue');
    const rangeValue = document.getElementById('rangeValue');
    const aimText = document.getElementById('aimText');
    const fireBtn = document.getElementById('fireBtn');
    const flash = document.getElementById('flash');
    const angleDown = document.getElementById('angleDown');
    const angleUp = document.getElementById('angleUp');

    const world = {
      w: 0,
      h: 0,
      gunX: 160,
      gunY: 0,
      targetX: 1400,
      targetY: 0,
      targetRadius: 28,
      wind: 0.8,
      shot: null,
      impact: null,
      lastShotAt: 0,
      score: 0,
      ammo: 12,
      message: 'พร้อมยิง',
      fired: false
    };

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      world.w = window.innerWidth;
      world.h = window.innerHeight;
      world.gunY = world.h * 0.78;
      world.targetY = world.h * 0.78 - 30;
      world.targetX = Number(distanceInput.value);
    }

    function applyUI() {
      const angle = Number(angleInput.value);
      const distance = Number(distanceInput.value);
      angleValue.textContent = `${angle.toFixed(1)}°`;
      rangeValue.textContent = `${(distance / 1000).toFixed(1)} km`;
      aimText.textContent = `θ ${angle.toFixed(1)}° · ระยะ ${(distance / 1000).toFixed(1)} km`;
      world.wind = (Math.sin(Date.now() / 1000) * 0.9 + 0.4).toFixed(2);
    }

    function randomWind() {
      world.wind = Number((Math.sin(Date.now() / 1600) * 0.9 + 0.2).toFixed(2));
    }

    function updateTerrain() {
      world.targetX = Number(distanceInput.value) + 130;
      world.targetY = world.h * 0.78 - 30;
    }

    function drawSky() {
      const g = ctx.createLinearGradient(0, 0, 0, world.h);
      g.addColorStop(0, '#6ca5d4');
      g.addColorStop(0.22, '#d7edf8');
      g.addColorStop(0.58, '#d6e4ba');
      g.addColorStop(1, '#677d49');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, world.w, world.h);

      const sun = { x: world.w * 0.82, y: world.h * 0.15, r: 48 };
      const sunGrad = ctx.createRadialGradient(sun.x, sun.y, 10, sun.x, sun.y, sun.r);
      sunGrad.addColorStop(0, 'rgba(255,245,180,0.98)');
      sunGrad.addColorStop(0.25, 'rgba(255,205,110,0.85)');
      sunGrad.addColorStop(1, 'rgba(255,170,80,0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath(); ctx.arc(sun.x, sun.y, sun.r, 0, Math.PI * 2); ctx.fill();
    }

    function drawTerrain() {
      const groundY = world.h * 0.78;
      const hill1 = ctx.createLinearGradient(0, groundY - 70, 0, world.h);
      hill1.addColorStop(0, '#7d8a5b');
      hill1.addColorStop(1, '#4b563a');
      ctx.fillStyle = hill1;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      for (let x = 0; x <= world.w; x += 80) {
        const y = groundY - (Math.sin(x / 150) * 18 + Math.cos(x / 90) * 25 + 30);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(world.w, world.h);
      ctx.lineTo(0, world.h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#3b4b2b';
      ctx.fillRect(0, groundY, world.w, world.h - groundY);
    }

    function drawTarget() {
      const x = world.targetX + 120;
      const y = world.targetY;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#ffdb85';
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#c7552a';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(30, 0); ctx.moveTo(0, -30); ctx.lineTo(0, 30); ctx.stroke();
      ctx.restore();
    }

    function drawGun() {
      const x = world.gunX;
      const angle = Number(angleInput.value) * Math.PI / 180;
      const y = world.gunY;
      const barrelLength = 80;
      const endX = x + Math.cos(angle) * barrelLength;
      const endY = y - Math.sin(angle) * barrelLength;

      ctx.fillStyle = '#6f5a45';
      ctx.fillRect(x - 16, y - 10, 32, 20);

      ctx.strokeStyle = '#d7c28d';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.fillStyle = '#a66a3d';
      ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2d2d2d';
      ctx.fillRect(x - 22, y + 12, 44, 8);
    }

    function drawShell() {
      if (!world.shot) return;
      const s = world.shot;
      ctx.fillStyle = '#ffe7b3';
      ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill();
    }

    function drawImpact() {
      if (!world.impact) return;
      const p = world.impact;
      const r = 18 + Math.sin(Date.now() / 90) * 2;
      ctx.fillStyle = 'rgba(255,220,120,0.9)';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,130,80,0.75)';
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    }

    function shoot() {
      const now = performance.now();
      if (now - world.lastShotAt < 220 || world.ammo <= 0) return;
      world.lastShotAt = now;
      world.ammo -= 1;
      world.fired = true;

      const theta = Number(angleInput.value) * Math.PI / 180;
      const v0 = 120 + Number(distanceInput.value) * 0.028;
      const x0 = world.gunX;
      const y0 = world.gunY;

      world.shot = {
        x: x0,
        y: y0,
        vx: Math.cos(theta) * v0,
        vy: -Math.sin(theta) * v0,
        life: 0,
        trail: []
      };

      playShotSound();
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 80);
    }

    function playShotSound() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audio = new AudioCtx();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const noise = audio.createBufferSource();
      const buffer = audio.createBuffer(1, audio.sampleRate * 0.2, audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);

      noise.buffer = buffer;
      const filter = audio.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1300;

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, audio.currentTime);
      osc.frequency.exponentialRampToValueAtTime(44, audio.currentTime + 0.3);

      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(1.2, audio.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.45);

      osc.connect(gain);
      gain.connect(audio.destination);
      noise.connect(filter);
      filter.connect(audio.destination);
      filter.gain.value = 0.35;

      osc.start();
      osc.stop(audio.currentTime + 0.45);
      noise.start();
      noise.stop(audio.currentTime + 0.12);
      setTimeout(() => audio.close(), 500);
    }

    function updateShot(dt) {
      if (!world.shot) return;
      const s = world.shot;
      const gravity = 170;
      const wind = world.wind * 16;

      s.vx += (wind * dt * 0.2);
      s.vy += gravity * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life += dt;
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 20) s.trail.shift();

      const ground = world.h * 0.78;
      const targetX = world.targetX + 120;
      const targetY = world.targetY;

      if (s.y >= ground) {
        world.impact = { x: s.x, y: ground };
        const isHit = Math.abs(s.x - targetX) < 32 && Math.abs(ground - targetY) < 40;
        world.message = isHit ? 'กระสุนโดนเป้า!' : 'พลาดเล็กน้อย – ปรับมุม';
        if (isHit) {
          world.score += 1;
          world.impact = { x: targetX, y: targetY };
        }
        world.shot = null;
        return;
      }

      const distanceError = Math.abs(s.x - targetX);
      if (s.life > 7 && distanceError > 250) {
        world.message = 'หลุดเป้า – ใช้การอ่านลมและมุมใหม่';
        world.shot = null;
      }
    }

    function drawTrail() {
      if (!world.shot || world.shot.trail.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,238,180,0.9)';
      ctx.lineWidth = 2.3;
      for (let i = 0; i < world.shot.trail.length; i++) {
        const p = world.shot.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    function drawMessage() {
      ctx.fillStyle = 'rgba(5,15,22,0.58)';
      ctx.fillRect(18, 18, 360, 42);
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.strokeRect(18, 18, 360, 42);
      ctx.fillStyle = '#edf4ff';
      ctx.font = '700 20px Segoe UI';
      ctx.fillText(world.message, 36, 46);

      ctx.fillStyle = 'rgba(5,15,22,0.58)';
      ctx.fillRect(world.w - 210, 18, 180, 42);
      ctx.fillStyle = '#ffcb6b';
      ctx.font = '700 20px Segoe UI';
      ctx.fillText(`คะแนน ${world.score}`, world.w - 190, 46);

      ctx.fillStyle = 'rgba(5,15,22,0.58)';
      ctx.fillRect(world.w - 195, world.h - 56, 165, 36);
      ctx.fillStyle = '#cfeaff';
      ctx.font = '700 18px Segoe UI';
      ctx.fillText(`กระสุน ${world.ammo}`, world.w - 170, world.h - 32);
    }

    function render() {
      ctx.clearRect(0, 0, world.w, world.h);
      drawSky();
      drawTerrain();
      drawTarget();
      drawGun();
      drawTrail();
      drawShell();
      drawImpact();
      drawMessage();
    }

    function loop(ts) {
      randomWind();
      updateShot(0.017);
      applyUI();
      render();
      requestAnimationFrame(loop);
    }

    angleInput.addEventListener('input', applyUI);
    distanceInput.addEventListener('input', () => { updateTerrain(); applyUI(); });
    fireBtn.addEventListener('click', shoot);
    angleDown.addEventListener('click', () => { angleInput.value = Math.max(Number(angleInput.min), Number(angleInput.value) - 1); applyUI(); });
    angleUp.addEventListener('click', () => { angleInput.value = Math.min(Number(angleInput.max), Number(angleInput.value) + 1); applyUI(); });

    window.addEventListener('resize', resize);

    (function init() {
      resize();
      updateTerrain();
      applyUI();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
