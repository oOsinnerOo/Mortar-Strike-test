<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortar Strike</title>
  <style>
    :root {
      --bg0: #07131c;
      --bg1: #112d3f;
      --ink: #edf6ff;
      --muted: #bae1ff;
      --panel: rgba(9, 17, 28, 0.64);
      --panel-border: rgba(255,255,255,0.14);
      --gold: #ffd27a;
      --accent: #ff914d;
      --accent2: #ffb062;
      --good: #89f0a5;
      --warn: #ffdb7a;
      --danger: #ff6a7a;
      --shadow: rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg0); color: var(--ink);
    }
    body { display: flex; }

    #game {
      position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, #5a8dc2 0%, #a7d4ee 18%, #dfe9d1 58%, #6e7a4c 100%);
      overflow: hidden;
    }

    canvas {
      display: block; width: 100%; height: 100%;
      background: linear-gradient(180deg, #6ea8d7 0%, #dceaf7 24%, #cfe3af 58%, #6f7c4b 100%);
    }

    .hud {
      position: absolute; inset: 0; pointer-events: none;
    }

    .topbar {
      position: absolute; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; gap: 14px;
      align-items: flex-start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 12px 30px var(--shadow);
      pointer-events: auto;
    }

    .status { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
    .badge {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #1a120e; font-weight: 900; font-size: 1.1rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 18px rgba(255,145,77,.3);
    }

    .small-label {
      display: block; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 2px;
    }

    .status-main { font-size: 1.08rem; font-weight: 800; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--good);
      box-shadow: 0 0 14px rgba(137,240,165,.9); margin-right: 8px; vertical-align: middle;
    }

    .aim-panel {
      min-width: 300px; padding: 10px 16px;
    }

    .aim-main {
      font-size: 1.08rem; font-weight: 800; letter-spacing: .04em;
    }

    .bottom {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: min(1020px, calc(100vw - 18px));
      display: flex; justify-content: center;
      pointer-events: none;
    }

    .controls {
      pointer-events: auto;
      background: rgba(8, 18, 28, 0.75);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      box-shadow: 0 12px 28px rgba(0,0,0,0.34);
    }

    .stepper {
      width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.05); color: var(--ink);
      border-radius: 10px; font-size: 1.5rem; font-weight: 800; padding: 0; cursor: pointer;
    }

    .group {
      min-width: 190px;
      display: flex; flex-direction: column; gap: 5px;
    }

    .group label {
      font-size: .64rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    }

    .group strong {
      font-size: 1.08rem; font-weight: 800; letter-spacing: .04em;
    }

    input[type="range"] {
      width: 100%; accent-color: var(--accent);
    }

    button {
      border: 0; background: linear-gradient(180deg, var(--accent2), var(--accent));
      color: #1d160f; border-radius: 12px; padding: 11px 16px; font-weight: 900; letter-spacing: .06em;
      cursor: pointer; box-shadow: 0 10px 18px rgba(255,145,77,.24);
      transition: transform .12s ease, filter .12s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    .level-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-left: 8px;
    }

    .mini {
      background: rgba(255,255,255,.06);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: none;
      padding: 8px 10px;
      border-radius: 10px;
    }

    .info-box {
      position: absolute; left: 18px; top: 92px; width: min(340px, calc(100vw - 36px));
      background: rgba(8, 18, 28, 0.68); border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(8px);
      box-shadow: 0 12px 24px rgba(0,0,0,.24);
    }

    .info-box h3 {
      margin: 0 0 6px; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }

    .stats-row {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: .8rem; color: var(--ink);
    }

    .stat { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 7px 8px; }
    .stat b { display: block; font-size: 1rem; }

    .flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: rgba(255,255,255,.28); transition: opacity .08s ease;
    }
    .flash.on { opacity: 1; }

    @media (max-width: 760px) {
      .topbar { flex-direction: column; }
      .aim-panel { min-width: 0; width: 100%; }
      .info-box { top: 140px; }
      .controls { justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="scene"></canvas>

    <div class="hud">
      <div class="topbar">
        <div class="panel status">
          <div class="badge">M</div>
          <div>
            <span class="small-label">สถานะ</span>
            <div class="status-main"><span class="dot"></span><span id="statusText">พร้อมยิง</span></div>
          </div>
        </div>

        <div class="panel aim-panel">
          <div class="small-label">เล็ง</div>
          <div class="aim-main" id="aimText">θ 58.0° · ระยะ 1.4 km</div>
        </div>
      </div>

      <div class="info-box">
        <h3>ข้อมูล</h3>
        <div class="stats-row">
          <div class="stat"><b id="distX">0 m</b><small>ระยะเป้า</small></div>
          <div class="stat"><b id="altY">0 m</b><small>ความสูง</small></div>
          <div class="stat"><b id="projectileRange">0 m</b><small>โพรเจกไทล์</small></div>
          <div class="stat"><b id="windInfo">0 m/s</b><small>ลมทิศ</small></div>
        </div>
      </div>

      <div class="bottom">
        <div class="controls">
          <div class="group">
            <label>มุมยิง (θ)</label>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button class="stepper" data-angle="-1">−</button>
              <strong id="angleValue" style="min-width: 50px;">58°</strong>
              <button class="stepper" data-angle="+1">+</button>
            </div>
          </div>

          <div class="group">
            <label>ความเร็ว</label>
            <input type="range" id="velocitySlider" min="10" max="100" value="45" />
            <strong id="velocityValue">45 m/s</strong>
          </div>

          <button id="fireBtn">🎯 ยิง!</button>

          <div class="level-actions">
            <button class="mini" onclick="resetLevel()">รีเซ็ต</button>
            <button class="mini" onclick="togglePause()">หยุด/เล่น</button>
          </div>
        </div>
      </div>
    </div>
    <div class="flash" id="flash"></div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gameState = {
      angle: 58,
      velocity: 45,
      wind: 2,
      targetX: 8000,
      targetY: 500,
      projectiles: [],
      isPaused: false,
      canFire: true,
      score: 0
    };

    const G = 9.81;

    function drawTerrain() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#6ea8d7');
      gradient.addColorStop(0.24, '#dceaf7');
      gradient.addColorStop(0.58, '#cfe3af');
      gradient.addColorStop(1, '#6f7c4b');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const groundY = canvas.height * 0.7;
      ctx.fillStyle = '#4a5a3a';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    }

    function drawBase() {
      const baseX = 100;
      const baseY = canvas.height * 0.7 - 40;

      ctx.fillStyle = '#2a3a1a';
      ctx.fillRect(baseX - 60, baseY, 120, 50);
      ctx.strokeStyle = '#8aaa5a';
      ctx.lineWidth = 2;
      ctx.strokeRect(baseX - 60, baseY, 120, 50);

      const mortarX = baseX;
      const mortarY = baseY - 15;

      ctx.fillStyle = '#3a4a2a';
      ctx.beginPath();
      ctx.arc(mortarX, mortarY, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      const rad = (gameState.angle * Math.PI) / 180;
      const barrelEnd = 45;
      ctx.strokeStyle = '#5a7a4a';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(mortarX, mortarY);
      ctx.lineTo(mortarX + Math.cos(rad) * barrelEnd, mortarY - Math.sin(rad) * barrelEnd);
      ctx.stroke();
    }

    function drawTarget() {
      const screenX = (gameState.targetX / 10000) * canvas.width;
      const screenY = canvas.height * 0.7 - gameState.targetY;

      ctx.fillStyle = 'rgba(255, 106, 122, 0.3)';
      ctx.beginPath();
      ctx.arc(screenX, screenY, 40, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ff6a7a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(screenX, screenY, 30, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(screenX, screenY, 20, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawProjectiles() {
      gameState.projectiles.forEach((p, i) => {
        const screenX = (p.x / 10000) * canvas.width;
        const screenY = canvas.height * 0.7 - p.y;

        ctx.fillStyle = '#ffdb7a';
        ctx.beginPath();
        ctx.arc(screenX, screenY, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 219, 122, 0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(screenX, screenY, 12, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    function updatePhysics(dt) {
      if (gameState.isPaused) return;

      gameState.projectiles = gameState.projectiles.filter(p => {
        p.vx += (gameState.wind * 0.1);
        p.vy -= G * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        const screenY = canvas.height * 0.7 - p.y;
        if (screenY > canvas.height * 0.7 || p.x < 0 || p.x > 10000) {
          return false;
        }

        const distToTarget = Math.sqrt(
          Math.pow(p.x - gameState.targetX, 2) +
          Math.pow(p.y - gameState.targetY, 2)
        );
        if (distToTarget < 50) {
          gameState.score++;
          flashScreen();
          return false;
        }

        return true;
      });
    }

    function calculateRange() {
      const rad = (gameState.angle * Math.PI) / 180;
      const v = gameState.velocity;
      const sin2a = Math.sin(2 * rad);
      const range = (v * v * sin2a) / G;
      return Math.max(0, range);
    }

    function fire() {
      if (!gameState.canFire) return;

      gameState.canFire = false;

      const rad = (gameState.angle * Math.PI) / 180;
      const v = gameState.velocity;

      const projectile = {
        x: 100,
        y: canvas.height * 0.7 - 40,
        vx: Math.cos(rad) * v,
        vy: Math.sin(rad) * v
      };

      gameState.projectiles.push(projectile);

      document.getElementById('statusText').textContent = 'ยิงแล้ว...';
      setTimeout(() => {
        gameState.canFire = true;
        document.getElementById('statusText').textContent = 'พร้อมยิง';
      }, 800);
    }

    function flashScreen() {
      const flash = document.getElementById('flash');
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 80);
    }

    function updateUI() {
      document.getElementById('angleValue').textContent = gameState.angle + '°';
      document.getElementById('velocityValue').textContent = gameState.velocity + ' m/s';
      document.getElementById('aimText').textContent = 
        `θ ${gameState.angle}° · ระยะ ${(gameState.targetX / 1000).toFixed(1)} km`;
      document.getElementById('distX').textContent = gameState.targetX + ' m';
      document.getElementById('altY').textContent = gameState.targetY + ' m';
      document.getElementById('projectileRange').textContent = Math.round(calculateRange()) + ' m';
      document.getElementById('windInfo').textContent = gameState.wind + ' m/s';
    }

    document.querySelectorAll('[data-angle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const delta = parseInt(e.target.dataset.angle);
        gameState.angle = Math.max(1, Math.min(89, gameState.angle + delta));
        updateUI();
      });
    });

    document.getElementById('velocitySlider').addEventListener('input', (e) => {
      gameState.velocity = parseInt(e.target.value);
      updateUI();
    });

    document.getElementById('fireBtn').addEventListener('click', fire);

    function resetLevel() {
      gameState.projectiles = [];
      gameState.canFire = true;
      gameState.score = 0;
      gameState.angle = 58;
      gameState.velocity = 45;
      gameState.wind = Math.random() * 4 - 2;
      document.getElementById('statusText').textContent = 'พร้อมยิง';
      updateUI();
    }

    function togglePause() {
      gameState.isPaused = !gameState.isPaused;
    }

    function animate() {
      drawTerrain();
      drawBase();
      drawTarget();
      drawProjectiles();

      updatePhysics(0.016);
      updateUI();

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    updateUI();
    animate();
  </script>
</body>
</html>
