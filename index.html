<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortar Strike</title>
  <style>
    :root {
      --bg0: #07131c;
      --bg1: #112d3f;
      --ink: #edf6ff;
      --muted: #bae1ff;
      --panel: rgba(9, 17, 28, 0.64);
      --panel-border: rgba(255,255,255,0.14);
      --gold: #ffd27a;
      --accent: #ff914d;
      --accent2: #ffb062;
      --good: #89f0a5;
      --warn: #ffdb7a;
      --danger: #ff6a7a;
      --shadow: rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg0); color: var(--ink);
    }
    body { display: flex; }

    #game {
      position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, #5a8dc2 0%, #a7d4ee 18%, #dfe9d1 58%, #6e7a4c 100%);
      overflow: hidden;
    }

    canvas {
      display: block; width: 100%; height: 100%;
      background: linear-gradient(180deg, #6ea8d7 0%, #dceaf7 24%, #cfe3af 58%, #6f7c4b 100%);
    }

    .hud {
      position: absolute; inset: 0; pointer-events: none;
    }

    .topbar {
      position: absolute; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; gap: 14px;
      align-items: flex-start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 12px 30px var(--shadow);
      pointer-events: auto;
    }

    .status { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
    .badge {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #1a120e; font-weight: 900; font-size: 1.1rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 18px rgba(255,145,77,.3);
    }

    .small-label {
      display: block; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 2px;
    }

    .status-main { font-size: 1.08rem; font-weight: 800; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--good);
      box-shadow: 0 0 14px rgba(137,240,165,.9); margin-right: 8px; vertical-align: middle;
    }

    .aim-panel {
      min-width: 300px; padding: 10px 16px;
    }

    .aim-main {
      font-size: 1.08rem; font-weight: 800; letter-spacing: .04em;
    }

    .bottom {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: min(1020px, calc(100vw - 18px));
      display: flex; justify-content: center;
      pointer-events: none;
    }

    .controls {
      pointer-events: auto;
      background: rgba(8, 18, 28, 0.75);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      box-shadow: 0 12px 28px rgba(0,0,0,0.34);
    }

    .stepper {
      width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.05); color: var(--ink);
      border-radius: 10px; font-size: 1.5rem; font-weight: 800; padding: 0; cursor: pointer;
    }

    .group {
      min-width: 190px;
      display: flex; flex-direction: column; gap: 5px;
    }

    .group label {
      font-size: .64rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    }

    .group strong {
      font-size: 1.08rem; font-weight: 800; letter-spacing: .04em;
    }

    input[type="range"] {
      width: 100%; accent-color: var(--accent);
    }

    button {
      border: 0; background: linear-gradient(180deg, var(--accent2), var(--accent));
      color: #1d160f; border-radius: 12px; padding: 11px 16px; font-weight: 900; letter-spacing: .06em;
      cursor: pointer; box-shadow: 0 10px 18px rgba(255,145,77,.24);
      transition: transform .12s ease, filter .12s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    .level-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-left: 8px;
    }

    .mini {
      background: rgba(255,255,255,.06);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: none;
      padding: 8px 10px;
      border-radius: 10px;
    }

    .info-box {
      position: absolute; left: 18px; top: 92px; width: min(340px, calc(100vw - 36px));
      background: rgba(8, 18, 28, 0.68); border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(8px);
      box-shadow: 0 12px 24px rgba(0,0,0,.24);
    }

    .info-box h3 {
      margin: 0 0 6px; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }

    .stats-row {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: .8rem; color: var(--ink);
    }

    .stat { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 7px 8px; }
    .stat b { display: block; font-size: 1rem; }

    .flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: rgba(255,255,255,.28); transition: opacity .08s ease;
    }
    .flash.on { opacity: 1; }

    @media (max-width: 760px) {
      .topbar { flex-direction: column; }
      .aim-panel { min-width: 0; width: 100%; }
      .info-box { top: 140px; }
      .controls { justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="scene"></canvas>

    <div class="hud">
      <div class="topbar">
        <div class="panel status">
          <div class="badge">M</div>
          <div>
            <span class="small-label">สถานะ</span>
            <div class="status-main"><span class="dot"></span><span id="statusText">พร้อมยิง</span></div>
          </div>
        </div>

        <div class="panel aim-panel">
          <div class="small-label">เล็ง</div>
          <div class="aim-main" id="aimText">θ 58.0° · ระยะ 1.4 km</div>
        </div>
      </div>

      <div class="info-box panel">
        <h3>สถิติ</h3>
        <div class="stats-row">
          <div class="stat">ระดับ <b id="levelText">1</b></div>
          <div class="stat">คะแนน <b id="scoreText">0</b></div>
          <div class="stat">กระสุน <b id="ammoText">9</b></div>
          <div class="stat">โดน <b id="hitText">0</b></div>
        </div>
      </div>

      <div class="bottom">
        <div class="controls">
          <button class="stepper" id="angleDown" aria-label="ลดมุม">−</button>
          <div class="group">
            <label>มุม</label>
            <strong id="angleValue">58.0°</strong>
            <input id="angle" type="range" min="18" max="82" value="58" step="0.5" />
          </div>
          <button class="stepper" id="angleUp" aria-label="เพิ่มมุม">+</button>

          <div class="group">
            <label>ระยะ</label>
            <strong id="rangeValue">1.4 km</strong>
            <input id="distance" type="range" min="400" max="4400" value="1400" step="10" />
          </div>

          <button id="fireBtn">ยิง</button>
          <button id="nextBtn" style="background:linear-gradient(180deg,#f0d78d,#e7b648);">ด่านถัดไป</button>

          <div class="level-actions">
            <button class="mini" data-difficulty="easy">ง่าย</button>
            <button class="mini" data-difficulty="normal">ปกติ</button>
            <button class="mini" data-difficulty="hard">ยาก</button>
            <button class="mini" data-difficulty="real">สมจริง</button>
          </div>
        </div>
      </div>
    </div>

    <div class="flash" id="flash"></div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const angleInput = document.getElementById('angle');
    const distanceInput = document.getElementById('distance');
    const aimText = document.getElementById('aimText');
    const statusText = document.getElementById('statusText');
    const angleValue = document.getElementById('angleValue');
    const rangeValue = document.getElementById('rangeValue');
    const flash = document.getElementById('flash');
    const scoreText = document.getElementById('scoreText');
    const ammoText = document.getElementById('ammoText');
    const hitText = document.getElementById('hitText');
    const levelText = document.getElementById('levelText');

    const state = {
      level: 1,
      score: 0,
      hits: 0,
      ammo: 9,
      angle: 58,
      range: 1400,
      wind: 0.8,
      shot: null,
      particles: [],
      target: { x: 0, y: 0, r: 26, hit: false },
      impact: null,
      difficulty: 'normal',
      night: false,
      status: 'พร้อมยิง',
      lastShot: 0,
      bonus: 0,
      driftPhase: 0
    };

    const difficulties = {
      easy: { label: 'ง่าย', ammo: 12, wind: 0.6, drift: 0.75, score: 1.0 },
      normal: { label: 'ปกติ', ammo: 9, wind: 0.9, drift: 1.0, score: 1.15 },
      hard: { label: 'ยาก', ammo: 7, wind: 1.25, drift: 1.25, score: 1.4 },
      real: { label: 'สมจริง', ammo: 6, wind: 1.65, drift: 1.55, score: 1.6 }
    };

    function applyDifficulty(name) {
      state.difficulty = name;
      const d = difficulties[name] || difficulties.normal;
      state.ammo = d.ammo;
      state.wind = d.wind;
      state.status = `โหมด ${d.label}`;
      document.querySelectorAll('[data-difficulty]').forEach(btn => {
        btn.style.background = btn.dataset.difficulty === name
          ? 'linear-gradient(180deg, #ffd88a, #f0b04a)'
          : 'rgba(255,255,255,.06)';
        btn.style.color = btn.dataset.difficulty === name ? '#1d160f' : '#edf6ff';
        btn.style.border = btn.dataset.difficulty === name ? '1px solid rgba(255,255,255,.2)' : '1px solid rgba(255,255,255,.12)';
      });
      updateHud();
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      updateTargetFromRange();
    }

    function updateTargetFromRange() {
      const dist = Number(distanceInput.value);
      const targetX = 180 + dist * 0.9;
      const groundY = window.innerHeight * 0.78;
      state.target.x = targetX;
      state.target.y = groundY - 12;
      state.range = dist;
      state.target.hit = false;
    }

    function updateHud() {
      state.angle = Number(angleInput.value);
      state.range = Number(distanceInput.value);
      angleValue.textContent = `${state.angle.toFixed(1)}°`;
      rangeValue.textContent = `${(state.range / 1000).toFixed(1)} km`;
      aimText.textContent = `θ ${state.angle.toFixed(1)}° · ระยะ ${(state.range / 1000).toFixed(1)} km`;
      statusText.textContent = state.status;
      scoreText.textContent = String(state.score);
      ammoText.textContent = String(state.ammo);
      hitText.textContent = String(state.hits);
      levelText.textContent = String(state.level);
      updateTargetFromRange();
    }

    function nextLevel() {
      state.level += 1;
      const baseRange = 1000 + (state.level * 260);
      distanceInput.value = String(Math.min(baseRange, 4400));
      angleInput.value = String(Math.min(78, 52 + state.level * 1.3));
      const diff = difficulties[state.difficulty] || difficulties.normal;
      state.ammo = diff.ammo;
      state.night = state.level % 3 === 0;
      state.status = `ด่าน ${state.level}`;
      updateHud();
    }

    function triggerFlash() {
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 90);
    }

    function makeShotSound() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      const audio = new AudioCtor();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const noise = audio.createBufferSource();
      const buffer = audio.createBuffer(1, audio.sampleRate * 0.22, audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.6);
      }
      noise.buffer = buffer;
      const filter = audio.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1700;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120 + state.level * 2, audio.currentTime);
      osc.frequency.exponentialRampToValueAtTime(38, audio.currentTime + 0.3);
      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(1.1, audio.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.42);
      osc.connect(gain);
      gain.connect(audio.destination);
      noise.connect(filter);
      filter.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.45);
      noise.start();
      noise.stop(audio.currentTime + 0.12);
      setTimeout(() => audio.close(), 500);
    }

    function fireShot() {
      const now = performance.now();
      if (now - state.lastShot < 220 || state.ammo <= 0) return;
      state.lastShot = now;
      state.ammo -= 1;
      const theta = state.angle * Math.PI / 180;
      const v0 = 120 + state.range * 0.032;
      const x0 = 150;
      const y0 = window.innerHeight * 0.78;
      state.shot = {
        x: x0,
        y: y0,
        vx: Math.cos(theta) * v0,
        vy: -Math.sin(theta) * v0,
        life: 0,
        trail: []
      };
      state.status = 'ยิง...';
      triggerFlash();
      makeShotSound();
      updateHud();
    }

    function spawnImpact(x, y, hit) {
      for (let i = 0; i < 32; i++) {
        const a = (Math.PI * 2 * i) / 32 + Math.random() * 0.8;
        const sp = 18 + Math.random() * 40;
        state.particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 10,
          alpha: 1,
          life: 1,
          color: hit ? '#ffd36e' : '#ff7c5a',
          r: hit ? 5 : 4
        });
      }
      state.impact = { x, y, r: 24, hit, t: 0 };
    }

    function updateShot(dt) {
      if (!state.shot) return;
      const s = state.shot;
      const gravity = 170;
      const drift = state.wind * 15 * (difficulties[state.difficulty] || difficulties.normal).drift;
      s.vx += drift * dt * 0.7;
      s.vy += gravity * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life += dt;
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 24) s.trail.shift();

      const groundY = window.innerHeight * 0.78;
      const targetCenterX = state.target.x;
      const targetCenterY = state.target.y;

      if (s.y >= groundY) {
        const hit = Math.abs(s.x - targetCenterX) < 30 && Math.abs(s.y - targetCenterY) < 34;
        state.status = hit ? 'โดนเป้า!' : 'พลาด';
        if (hit) {
          const bonus = difficulties[state.difficulty].score * (10 + state.level * 3);
          state.hits += 1;
          state.score += Math.round(bonus);
          state.target.hit = true;
          spawnImpact(targetCenterX, targetCenterY, true);
        } else {
          spawnImpact(s.x, groundY, false);
        }
        state.shot = null;
        updateHud();
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 28 * dt;
        p.life -= dt * 0.9;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      if (state.impact) {
        state.impact.t += dt;
        if (state.impact.t > 0.7) state.impact = null;
      }
    }

    function drawSky() {
      const w = window.innerWidth, h = window.innerHeight;
      const sky = state.night
        ? ['#050d16', '#0d1f35', '#243a5d']
        : ['#5d8dc6', '#bde5f5', '#dfead6'];

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, sky[0]);
      grad.addColorStop(0.3, sky[1]);
      grad.addColorStop(0.7, sky[2]);
      grad.addColorStop(1, '#6b7b4d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      const sunX = state.night ? w * 0.75 : w * 0.82;
      const sunY = state.night ? h * 0.18 : h * 0.14;
      const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 62);
      sunGrad.addColorStop(0, state.night ? 'rgba(208,225,255,0.9)' : 'rgba(255,241,181,0.95)');
      sunGrad.addColorStop(0.32, state.night ? 'rgba(135,186,255,0.42)' : 'rgba(255,214,140,0.8)');
      sunGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath(); ctx.arc(sunX, sunY, 62, 0, Math.PI * 2); ctx.fill();

      if (state.night) {
        for (let i = 0; i < 80; i++) {
          const x = ((i * 91) % w)
          const y = ((i * 53) % (h * 0.38));
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.fillRect(x, y, 2, 2);
        }
      }
    }

    function drawGround() {
      const w = window.innerWidth, h = window.innerHeight;
      const groundY = h * 0.78;
      ctx.fillStyle = '#3f5837';
      ctx.fillRect(0, groundY, w, h - groundY);

      ctx.beginPath();
      ctx.moveTo(0, groundY);
      for (let x = 0; x <= w; x += 70) {
        const y = groundY - (Math.sin(x / 140) * 16 + Math.cos(x / 90) * 22 + 16);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fillStyle = '#7c8b5f';
      ctx.fill();

      ctx.fillStyle = '#2e3c29';
      ctx.fillRect(0, h * 0.78, w, 12);
    }

    function drawTarget() {
      const t = state.target;
      const groundY = window.innerHeight * 0.78;
      const x = t.x + Math.sin((performance.now() / 700) + state.level) * 8;
      const y = groundY - 12;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#f4d66a';
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d0562f';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(30, 0); ctx.moveTo(0, -30); ctx.lineTo(0, 30); ctx.stroke();
      ctx.restore();
      state.target.x = x;
      state.target.y = y;
    }

    function drawGun() {
      const x = 150;
      const y = window.innerHeight * 0.78;
      const angle = state.angle * Math.PI / 180;
      const barrelLen = 86;
      const ex = x + Math.cos(angle) * barrelLen;
      const ey = y - Math.sin(angle) * barrelLen;

      ctx.fillStyle = '#6b5848';
      ctx.fillRect(x - 18, y - 10, 36, 20);
      ctx.fillStyle = '#2c2c2d';
      ctx.fillRect(x - 22, y + 10, 44, 10);

      ctx.strokeStyle = '#d8c99d';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      ctx.fillStyle = '#b67842';
      ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
    }

    function drawShotTrail() {
      if (!state.shot) return;
      const s = state.shot;
      if (s.trail.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,230,130,0.95)';
      ctx.lineWidth = 2.8;
      for (let i = 0; i < s.trail.length; i++) {
        const p = s.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    function drawImpact() {
      if (!state.impact) return;
      const p = state.impact;
      const pulse = 14 + Math.sin(p.t * 30) * 4;
      ctx.fillStyle = p.hit ? 'rgba(255,214,105,0.9)' : 'rgba(255,110,72,0.8)';
      ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = p.hit ? 'rgba(255,255,255,0.75)' : 'rgba(255,200,140,0.75)';
      ctx.beginPath(); ctx.arc(p.x, p.y, pulse * 0.5, 0, Math.PI * 2); ctx.fill();
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawWind() {
      const x = window.innerWidth - 190;
      const y = 90;
      ctx.fillStyle = 'rgba(8,18,28,0.6)';
      ctx.fillRect(x, y, 160, 42);
      ctx.strokeStyle = '#dfeeff';
      ctx.beginPath(); ctx.moveTo(x + 18, y + 22); ctx.lineTo(x + 132, y + 22); ctx.moveTo(x + 100, y + 12); ctx.lineTo(x + 132, y + 22); ctx.lineTo(x + 100, y + 32); ctx.stroke();
      ctx.fillStyle = '#ffd77a';
      ctx.font = '700 16px Segoe UI';
      ctx.fillText(`ลม ${state.wind.toFixed(1)} m/s`, x + 18, y + 18);
    }

    function render() {
      drawSky();
      drawGround();
      drawWind();
      drawTarget();
      drawGun();
      drawShotTrail();
      drawImpact();
      drawParticles();
    }

    function animate() {
      const dt = 1 / 60;
      updateShot(dt);
      updateParticles(dt);
      render();
      requestAnimationFrame(animate);
    }

    document.getElementById('fireBtn').addEventListener('click', fireShot);
    document.getElementById('nextBtn').addEventListener('click', nextLevel);
    document.getElementById('angleDown').addEventListener('click', () => {
      const v = Math.max(18, Number(angleInput.value) - 1);
      angleInput.value = String(v);
      updateHud();
    });
    document.getElementById('angleUp').addEventListener('click', () => {
      const v = Math.min(82, Number(angleInput.value) + 1);
      angleInput.value = String(v);
      updateHud();
    });
    angleInput.addEventListener('input', updateHud);
    distanceInput.addEventListener('input', updateHud);
    document.querySelectorAll('[data-difficulty]').forEach(btn => {
      btn.addEventListener('click', () => applyDifficulty(btn.dataset.difficulty));
    });
    window.addEventListener('resize', resize);

    function init() {
      state.difficulty = 'normal';
      state.night = false;
      const diff = difficulties.normal;
      state.ammo = diff.ammo;
      state.wind = diff.wind;
      applyDifficulty('normal');
      updateHud();
      resize();
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
</html>
